<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80" fill="none">
  <!-- Head -->
  <circle cx="32" cy="9" r="5" stroke="currentColor" stroke-width="3"/>
  <!-- Torso -->
  <path d="M32 15 Q31.5 32 32 52" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
  <!-- Both arms converging to chest -->
  <path d="M40 23 Q37 30 32 37" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M24 23 Q27 30 32 37" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Folded hands: closed diamond at convergence point -->
  <path d="M27 37 Q32 34 37 37 Q32 41 27 37 Z" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
  <!-- Ground -->
  <path d="M20 71 h24" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".28"/>
</svg>
