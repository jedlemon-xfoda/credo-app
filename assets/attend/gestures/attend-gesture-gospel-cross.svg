<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80" fill="none">
  <!-- Head -->
  <circle cx="32" cy="9" r="5" stroke="currentColor" stroke-width="3"/>
  <!-- Torso -->
  <path d="M32 15 Q31.5 33 32 54" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
  <!-- Right arm raised to forehead (same arc as sign-of-cross) -->
  <path d="M40 23 Q36 16 29 13" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Small cross traced at brow with the thumb -->
  <path d="M29 10 v5" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".7"/>
  <path d="M27 12.5 h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".7"/>
  <!-- Left arm: secondary at chest -->
  <path d="M24 23 Q25.5 32 27 41" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" opacity=".72"/>
  <!-- Ground -->
  <path d="M20 71 h24" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".28"/>
</svg>
