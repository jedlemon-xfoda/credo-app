<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80" fill="none">
  <!-- Frontal orans posture: both arms raised and opened to the assembly. -->
  <!-- Head: slight upward tilt (head slightly back in proclamation) -->
  <circle cx="32" cy="9" r="5" stroke="currentColor" stroke-width="3"/>
  <!-- Torso -->
  <path d="M32 15 Q31.5 33 32 54" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
  <!-- Right arm: raised outward (elbow at shoulder height, forearm up) -->
  <path d="M40 22 Q46 18 50 14" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Right forearm: angled upward -->
  <path d="M50 14 Q52 10 51 8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" opacity=".85"/>
  <!-- Left arm: mirror orans -->
  <path d="M24 22 Q18 18 14 14" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Left forearm -->
  <path d="M14 14 Q12 10 13 8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" opacity=".85"/>
  <!-- Ground -->
  <path d="M20 71 h24" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".28"/>
</svg>
