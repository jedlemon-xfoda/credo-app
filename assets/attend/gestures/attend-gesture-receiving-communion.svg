<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80" fill="none">
  <!-- Head: bowed in reverence -->
  <circle cx="32" cy="9" r="5" stroke="currentColor" stroke-width="3"/>
  <!-- Torso: slight forward bow follows the bowed head -->
  <path d="M32 15 Q30.5 30 31 50" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
  <!-- Both arms extended forward to receive -->
  <path d="M38 24 Q42 33 44 40" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M24 24 Q22 33 20 40" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Lower supporting hand (dominant, wider arc) -->
  <path d="M18 43 Q32 47 46 43" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" opacity=".9"/>
  <!-- Upper hand resting on lower (the vessel for the Host) -->
  <path d="M22 40 Q32 37 42 40" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".72"/>
  <!-- Ground -->
  <path d="M20 71 h24" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".28"/>
</svg>
