<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80" fill="none">
  <!-- Head -->
  <circle cx="32" cy="9" r="5" stroke="currentColor" stroke-width="3"/>
  <!-- Torso -->
  <path d="M32 15 Q31.5 33 32 54" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
  <!-- Right arm raised to forehead -->
  <path d="M40 23 Q36 16 28 13" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Fingertip at brow -->
  <path d="M28 13 Q27 11.5 26 13" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" opacity=".72"/>
  <!-- Left arm resting at chest -->
  <path d="M24 23 Q25.5 31 27 40" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" opacity=".8"/>
  <!-- Ground -->
  <path d="M20 71 h24" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".28"/>
</svg>
