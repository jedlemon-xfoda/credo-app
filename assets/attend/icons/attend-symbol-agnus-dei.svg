<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- Lamb body: horizontal oval — the Lamb of God faces right by tradition -->
  <path d="M5 14 Q5 10 12 9 Q18 9 18 13 Q18 17 12 18 Q5 18 5 14Z" stroke="currentColor" stroke-width="1.18" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Head: small circle at right, nearly touching the body -->
  <circle cx="20" cy="11" r="2.4" stroke="currentColor" stroke-width="1.1"/>
  <!-- Ear: small arc at top of head -->
  <path d="M19.5 8.6 Q20.5 7.5 21.5 8.8" stroke="currentColor" stroke-width=".85" stroke-linecap="round" opacity=".72"/>
  <!-- Cross/banner staff rising from the lamb's back -->
  <path d="M13 9 v-6" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
  <!-- Crossbar -->
  <path d="M11 5 h4" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
  <!-- Pennant: identifies the Agnus Dei -->
  <path d="M15 5 Q17 6.5 15 8" stroke="currentColor" stroke-width=".92" stroke-linecap="round" opacity=".75"/>
  <!-- Legs: two visible (side view) -->
  <path d="M10 18 v4" stroke="currentColor" stroke-width="1.06" stroke-linecap="round"/>
  <path d="M14 18 v4" stroke="currentColor" stroke-width="1.06" stroke-linecap="round"/>
</svg>
