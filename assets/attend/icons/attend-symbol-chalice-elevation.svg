<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 32" fill="none">
  <!-- Chalice: same proportions as chalice.svg, shifted 1pt higher for elevation context -->
  <path d="M7.7 3.8h8.6v2.7c0 2.9-1.8 5.05-4.3 5.05S7.7 9.35 7.7 6.5V3.8Z" stroke="currentColor" stroke-width="1.24" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Paten line -->
  <path d="M8.9 5.35h6.2" stroke="currentColor" stroke-width=".95" stroke-linecap="round" opacity=".45"/>
  <!-- Stem -->
  <path d="M12 11.55v5.2" stroke="currentColor" stroke-width="1.24" stroke-linecap="round"/>
  <!-- Base -->
  <path d="M8.65 18.8h6.7" stroke="currentColor" stroke-width="1.18" stroke-linecap="round"/>
  <!-- Upward motion: very subtle dash below base -->
  <path d="M12 19.4v1.8" stroke="currentColor" stroke-width=".85" stroke-linecap="round" stroke-dasharray="1 1.4" opacity=".32"/>
  <!-- Two upraised hands -->
  <path d="M9 30 Q9.5 26 10 22" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M15 30 Q14.5 26 14 22" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Hand bases -->
  <path d="M7 31 h3.5" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
  <path d="M13.5 31 h3.5" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
</svg>
