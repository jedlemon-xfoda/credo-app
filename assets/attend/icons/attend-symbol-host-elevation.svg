<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 32" fill="none">
  <!-- Host disc: elevated -->
  <circle cx="12" cy="6" r="4" stroke="currentColor" stroke-width="1.24"/>
  <!-- Short sacred rays around the host -->
  <path d="M12 1v1.6" stroke="currentColor" stroke-width="1" stroke-linecap="round" opacity=".62"/>
  <path d="M12 9.4v1.6" stroke="currentColor" stroke-width="1" stroke-linecap="round" opacity=".62"/>
  <path d="M7.2 6H8.8" stroke="currentColor" stroke-width="1" stroke-linecap="round" opacity=".62"/>
  <path d="M15.2 6h1.6" stroke="currentColor" stroke-width="1" stroke-linecap="round" opacity=".62"/>
  <!-- Cross in host (IHS — very subtle) -->
  <path d="M12 3.8v4.4" stroke="currentColor" stroke-width=".65" stroke-linecap="round" opacity=".3"/>
  <path d="M9.8 6h4.4" stroke="currentColor" stroke-width=".65" stroke-linecap="round" opacity=".3"/>
  <!-- Two upraised hands lifting the host -->
  <path d="M9 29 Q9.5 22 10 14" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M15 29 Q14.5 22 14 14" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Hand bases -->
  <path d="M7 30 h3.5" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
  <path d="M13.5 30 h3.5" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
</svg>
