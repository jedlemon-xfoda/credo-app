<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- Single figure mid-stride: measured, dignified recessional pace. -->
  <!-- Head -->
  <circle cx="12" cy="4" r="2" stroke="currentColor" stroke-width="1.14"/>
  <!-- Torso: slight forward lean (in motion) -->
  <path d="M12 6.5 Q11.8 11 12 17" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Legs: stride V -->
  <path d="M9 23 L12 17 L15 23" stroke="currentColor" stroke-width="1.16" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Arms: stride swing -->
  <path d="M9.5 9 Q7.5 11 7 14" stroke="currentColor" stroke-width="1.06" stroke-linecap="round" opacity=".85"/>
  <path d="M14.5 9 Q16 11 16.5 14" stroke="currentColor" stroke-width="1.02" stroke-linecap="round" opacity=".78"/>
  <!-- Ground -->
  <path d="M5 23 h14" stroke="currentColor" stroke-width=".9" stroke-linecap="round" opacity=".28"/>
</svg>
