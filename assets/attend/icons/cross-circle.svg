<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!--
    CROSS-IN-CIRCLE — derived from same sacred geometry as cross-latin.
    Circle is the container; cross inside maintains Catholic proportions.

    Circle: r=10.2, center (12,12).
    Cross vertical: y=4 → y=20 = 16 units (centered in circle, 2px margin top/bottom)
    Cross horizontal: x=6.5 → x=17.5 = 11 units
    Crossbar: y=8.5: 4.5 above / 11.5 below = 1 : 2.56  ✓ Catholic
  -->
  <circle cx="12" cy="12" r="10.2" stroke="currentColor" stroke-width="1.18"/>
  <path d="M12 4v16" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M6.5 8.5h11" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
</svg>
