<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!--
    EASTER SUNRISE — resurrection dawn.
    Rising sun half-disk breaking the horizon. Rays reach upward.
    The horizon line is definite (earth below); the light above is expansive.
    Warm, hope-filled — the opposite of Lent's restraint.
  -->

  <!-- ── Upper rays (reaching upward from rising sun) ── -->
  <path d="M12 9.2V6.8" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
  <path d="M15.6 10.6l1.8-1.8" stroke="currentColor" stroke-width="1.05" stroke-linecap="round"/>
  <path d="M8.4 10.6 6.6 8.8" stroke="currentColor" stroke-width="1.05" stroke-linecap="round"/>
  <path d="M18.6 14h2" stroke="currentColor" stroke-width="1.0" stroke-linecap="round"/>
  <path d="M5.4 14H3.4" stroke="currentColor" stroke-width="1.0" stroke-linecap="round"/>

  <!-- Diagonal shorter rays -->
  <path d="M17.4 11l1.2-.7" stroke="currentColor" stroke-width=".88" stroke-linecap="round" opacity=".58"/>
  <path d="M6.6 11 5.4 10.3" stroke="currentColor" stroke-width=".88" stroke-linecap="round" opacity=".58"/>

  <!-- ── Rising sun half-disk ── -->
  <path d="M4.8 16.5 A7.2 7.2 0 0 1 19.2 16.5" stroke="currentColor" stroke-width="1.28" stroke-linecap="round"/>

  <!-- Inner warm glow arc (warmth / glory within the sun) -->
  <path d="M7.5 16.5 A4.5 4.5 0 0 1 16.5 16.5" stroke="currentColor" stroke-width=".78" stroke-linecap="round" opacity=".32"/>

  <!-- ── Horizon ── -->
  <path d="M2 16.5h20" stroke="currentColor" stroke-width="1.16" stroke-linecap="round"/>

  <!-- Earth / gentle hills below -->
  <path d="M2 20 Q7.5 18 12 19.6 Q16.5 21.2 22 19.4" stroke="currentColor" stroke-width=".88" stroke-linecap="round" opacity=".38"/>
</svg>
