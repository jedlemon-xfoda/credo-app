<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!--
    LENT — cross over a dim background radiance.
    The cross is clear and bold (foreground); the rays are very faint
    (background). Tension: the light is there but held back. Penitential.
    Cross uses same sacred geometry: crossbar at ~28% from top.
  -->

  <!-- Background radiance (very faint — the passion light) -->
  <path d="M12 4v1.8M12 18.2V20" stroke="currentColor" stroke-width=".9" stroke-linecap="round" opacity=".3"/>
  <path d="M5.8 6.8l1.2 1.2M17 17l1.2 1.2" stroke="currentColor" stroke-width=".85" stroke-linecap="round" opacity=".25"/>
  <path d="M18.2 6.8l-1.2 1.2M6.8 17l-1.2 1.2" stroke="currentColor" stroke-width=".85" stroke-linecap="round" opacity=".25"/>
  <path d="M3.5 12H5.2M18.8 12H20.5" stroke="currentColor" stroke-width=".85" stroke-linecap="round" opacity=".25"/>

  <!-- Cross (foreground — full weight, full presence) -->
  <path d="M12 4.5v15" stroke="currentColor" stroke-width="1.42" stroke-linecap="round"/>
  <path d="M5.8 9h12.4" stroke="currentColor" stroke-width="1.42" stroke-linecap="round"/>
</svg>
