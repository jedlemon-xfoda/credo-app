<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!--
    OLIVE BRANCH — Ordinary Time. Peace, growth, ongoing fruitfulness.
    Stem curves naturally (not architecturally). Leaves are elliptical
    and slightly off-axis — organic, not mechanical.
    Subtle berries (olives) on two stems for botanical authenticity.
  -->

  <!-- Main stem: organic curve from bottom-right to upper-left -->
  <path d="M19 20 C15.5 17 11.5 13 6.5 6.5" stroke="currentColor" stroke-width="1.12" stroke-linecap="round"/>

  <!-- Leaf 1 (lower-right, off the main stem) -->
  <path d="M18 18.5 C20.8 16.2 21 13.2 18.5 13.5 C16 13.8 15.6 16.8 18 18.5Z" stroke="currentColor" stroke-width="1.02" stroke-linejoin="round"/>
  <!-- Leaf midrib -->
  <path d="M18 18.5 C18.8 16.5 18.8 14.8 18.5 13.5" stroke="currentColor" stroke-width=".6" stroke-linecap="round" opacity=".45"/>

  <!-- Leaf 2 (mid-right) -->
  <path d="M14.8 15 C17.4 12.6 17.4 9.8 15 10.2 C12.6 10.6 12.4 13.4 14.8 15Z" stroke="currentColor" stroke-width="1.02" stroke-linejoin="round"/>
  <path d="M14.8 15 C15.4 13 15.2 11.2 15 10.2" stroke="currentColor" stroke-width=".6" stroke-linecap="round" opacity=".45"/>

  <!-- Leaf 3 (mid-left, opposite side) -->
  <path d="M11.2 11.5 C8.8 9.2 9 6.4 11.4 7 C13.8 7.6 14 10.4 11.2 11.5Z" stroke="currentColor" stroke-width="1.02" stroke-linejoin="round"/>
  <path d="M11.2 11.5 C11.6 9.5 11.2 7.8 11.4 7" stroke="currentColor" stroke-width=".6" stroke-linecap="round" opacity=".45"/>

  <!-- Leaf 4 (upper-left, small) -->
  <path d="M7.8 8.2 C5.5 6.2 5.8 3.8 7.8 4.5 C9.8 5.2 10 7.6 7.8 8.2Z" stroke="currentColor" stroke-width=".98" stroke-linejoin="round"/>

  <!-- Olives (two small circles) -->
  <circle cx="17.5" cy="15.8" r=".88" stroke="currentColor" stroke-width=".85" opacity=".62"/>
  <circle cx="14" cy="11.5" r=".88" stroke="currentColor" stroke-width=".85" opacity=".62"/>
</svg>
